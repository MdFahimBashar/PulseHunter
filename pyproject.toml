[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsehunter"
version = "0.1.0"
description = "Distributed Device Validation Platform"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Md Fahim Bashar" }]
keywords = [
  "hardware-in-the-loop",
  "device-lab",
  "validation",
  "fastapi",
  "celery",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
pulsehunter-ci = "pulsehunter.ci:main"
pulsehunter-host-agent = "pulsehunter.host_agent.cli:main"

[project.optional-dependencies]
benchmark = [
  "matplotlib>=3.10,<4",
  "psutil>=7.2,<8",
]
host-agent = [
  "psutil>=7.2,<8",
]
dev = [
  "mypy>=1.14,<2",
  "psutil>=7.2,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
  "types-psutil>=7.1,<8",
]

[project.urls]
Repository = "https://github.com/MdFahimBashar/PulseHunter"
Issues = "https://github.com/MdFahimBashar/PulseHunter/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulsehunter*"]

[tool.setuptools.package-data]
pulsehunter = [
  "py.typed",
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that require PostgreSQL and Redis",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["src/pulsehunter"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
