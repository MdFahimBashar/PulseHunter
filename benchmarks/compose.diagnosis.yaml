name: pulsehunter-deadlock-diagnosis
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulsehunter
      POSTGRES_USER: pulsehunter
      POSTGRES_PASSWORD: pulsehunter
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsehunter -d pulsehunter"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - diagnosis-data:/var/lib/postgresql/data
volumes:
  diagnosis-data:
